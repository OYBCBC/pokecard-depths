<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招式特效靶场 — 宝可梦·晶穴深处</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e18; }
  body { font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #dfe6f2; }
  #game { position: fixed; inset: 0; cursor: crosshair; }

  #panel {
    position: fixed; left: 0; top: 0; bottom: 0; width: 308px; z-index: 10;
    background: rgba(9, 12, 24, 0.93); border-right: 1px solid rgba(127, 212, 255, 0.18);
    overflow-y: auto; padding: 14px 14px 28px; backdrop-filter: blur(6px);
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(127, 212, 255, 0.25); border-radius: 4px; }
  #panel h1 { font-size: 16px; color: #ffe9a0; letter-spacing: 1px; margin-bottom: 2px; }
  #panel .sub { font-size: 11px; color: #7d8aa5; margin-bottom: 12px; }
  #panel h2 {
    font-size: 12px; color: #9fd8ff; margin: 14px 0 6px; padding: 3px 8px;
    background: rgba(127, 212, 255, 0.08); border-left: 3px solid #7fd4ff; border-radius: 2px;
  }
  #panel a { color: #7fd4ff; }
  select, input[type="number"] {
    width: 100%; background: #141a2c; color: #dfe6f2; border: 1px solid #2a3550;
    border-radius: 4px; padding: 4px 6px; font: inherit; outline: none;
  }
  select:focus { border-color: #7fd4ff; }
  .row { display: flex; gap: 6px; margin: 4px 0; align-items: center; }
  .row > * { flex: 1; }
  .badge {
    display: inline-block; padding: 0 7px; border-radius: 3px; font-size: 11px;
    color: #0b0e18; font-weight: 600; margin-right: 4px; vertical-align: 1px;
  }
  .moves { max-height: 240px; overflow-y: auto; border: 1px solid #232d48; border-radius: 4px; background: #0d1220; }
  .moves::-webkit-scrollbar { width: 8px; }
  .moves::-webkit-scrollbar-thumb { background: rgba(127, 212, 255, 0.25); border-radius: 4px; }
  .moves h4 {
    font-size: 11px; color: #7d8aa5; padding: 5px 8px 2px; font-weight: 600;
    position: sticky; top: 0; background: #0d1220;
  }
  .move-opt {
    display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer;
    border-radius: 3px; user-select: none;
  }
  .move-opt:hover { background: rgba(127, 212, 255, 0.08); }
  .move-opt.sel { background: rgba(255, 226, 74, 0.16); outline: 1px solid rgba(255, 226, 74, 0.5); }
  .move-opt input { display: none; }
  .move-opt .mn { flex: 1; }
  .move-opt .pw { color: #7d8aa5; font-size: 11px; }
  .btn {
    display: inline-block; background: #1b2440; color: #dfe6f2; border: 1px solid #2e3c60;
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit; text-align: center;
  }
  .btn:hover { background: #253156; border-color: #7fd4ff; }
  .btn.warn { border-color: #a868d8; color: #e8d0ff; }
  .seg { display: flex; gap: 4px; }
  .seg .btn { flex: 1; padding: 3px 0; }
  .seg .btn.on { background: #2e5f8f; border-color: #7fd4ff; color: #fff; }
  label.ck { display: flex; gap: 6px; align-items: center; cursor: pointer; padding: 2px 0; }
  .kv { display: flex; justify-content: space-between; padding: 1.5px 2px; font-size: 12px; }
  .kv b { color: #ffe9a0; font-weight: 600; }
  .kv .hl { color: #7dff9b; }
  .kv .bad { color: #ff9a9a; }
  #log { font-size: 11.5px; max-height: 150px; overflow-y: auto; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: rgba(127, 212, 255, 0.25); border-radius: 4px; }
  #log div { padding: 1px 2px; border-bottom: 1px dashed #1a2238; color: #a8b4cc; }
  #log .k-super { color: #ffd24a; }
  #log .k-weak { color: #8fa0c0; }
  #log .k-immune { color: #7d8aa5; }
  #log .k-kill { color: #ff9a6b; }
  #dmgnums { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
  #dmgnums span {
    position: absolute; font: 700 15px/1 -apple-system, "PingFang SC", sans-serif;
    text-shadow: 0 0 4px #000, 0 1px 2px #000; animation: rise .75s ease-out forwards;
    transform: translate(-50%, -50%);
  }
  @keyframes rise { from { opacity: 1; } to { opacity: 0; translate: 0 -34px; } }
  #dhp-wrap { position: absolute; width: 84px; margin-left: -42px; text-align: center; }
  #dhp-name { font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; }
  #dhp-bar { height: 5px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.35); border-radius: 3px; overflow: hidden; }
  #dhp-fill { height: 100%; background: #7dff9b; width: 100%; }
  #dhp-txt { font-size: 10px; color: #cfd8ea; text-shadow: 0 1px 2px #000; }
  #fps { position: fixed; right: 10px; top: 8px; z-index: 10; font: 11px monospace; color: #7d8aa5; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fd8ff; z-index: 20; background: #0b0e18; }
  #loading.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="dmgnums"></div>
<div id="fps"></div>

<div id="panel">
  <h1>招式特效靶场</h1>
  <div class="sub">调试页 · 与游戏同引擎同特效 · <a href="index.html">← 回游戏</a></div>

  <h2>攻击方（你操作的宝可梦）</h2>
  <select id="atk-species"></select>
  <div class="row" id="atk-types"></div>
  <div class="moves" id="move-list"></div>
  <div class="row">
    <span class="btn" id="btn-z">放 Z 招式 (R)</span>
    <span class="btn" id="btn-pp">PP 充满</span>
  </div>

  <h2>靶子 Dummy</h2>
  <select id="dummy-species"></select>
  <div class="row" id="dummy-types"></div>
  <div class="seg" id="dummy-behavior">
    <span class="btn on" data-b="still">站桩</span>
    <span class="btn" data-b="wander">游走</span>
    <span class="btn" data-b="chase">追击</span>
  </div>
  <div class="row">
    <input type="number" id="dummy-hp" min="5" max="9999" value="100" title="靶子最大 HP">
    <span class="btn" id="btn-reset">重置靶子</span>
  </div>

  <h2>选项</h2>
  <label class="ck"><input type="checkbox" id="autofire" checked> 自动开火（否则按住鼠标左键）</label>
  <div class="seg" id="timescale">
    <span class="btn" data-s="0.25">0.25×</span>
    <span class="btn" data-s="0.5">0.5×</span>
    <span class="btn on" data-s="1">1×</span>
    <span class="btn" data-s="2">2×</span>
  </div>

  <h2>招式数据</h2>
  <div id="moveinfo"></div>

  <h2>对靶结算（理论）</h2>
  <div id="theory"></div>

  <h2>命中记录</h2>
  <div class="kv"><span>命中 / 击杀</span><b id="stat-hits">0 / 0</b></div>
  <div class="kv"><span>实测 DPS（近 6 秒）</span><b id="stat-dps">0.0</b></div>
  <div id="log"></div>
</div>

<div id="loading">装配靶场……</div>

<script type="module" src="js/lab.js?v=m8"></script>
</body>
</html>
